<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>自作PC予算計算ツール</title>
<style>
  :root {
    --bg: #0f1420;
    --card: #1a2233;
    --card2: #232f47;
    --text: #e8edf5;
    --muted: #9fb0c9;
    --accent: #4da3ff;
    --ok: #3ecf6f;
    --warn: #ffb340;
    --ng: #ff5d5d;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "Hiragino Kaku Gothic ProN", "Noto Sans JP", sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.6;
  }
  .wrap { max-width: 880px; margin: 0 auto; padding: 20px 16px 48px; }
  h1 { font-size: 1.5rem; margin: 8px 0 4px; }
  .sub { color: var(--muted); font-size: 0.85rem; margin-bottom: 20px; }
  h2 { font-size: 1.1rem; margin: 28px 0 10px; border-left: 4px solid var(--accent); padding-left: 8px; }
  .card {
    background: var(--card);
    border-radius: 12px;
    padding: 14px 16px;
    margin-bottom: 12px;
  }
  .card h3 { margin: 0 0 8px; font-size: 1rem; }
  table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
  td { padding: 3px 0; vertical-align: top; }
  td.cat { color: var(--muted); white-space: nowrap; padding-right: 8px; font-size: 0.8rem; }
  td.price { text-align: right; white-space: nowrap; padding-left: 8px; }
  .total { font-weight: bold; font-size: 1.05rem; text-align: right; margin-top: 6px; }
  input[type="number"] {
    width: 180px; padding: 8px 10px; border-radius: 8px; border: 1px solid #3a4a6b;
    background: var(--card2); color: var(--text); font-size: 1rem;
  }
  button {
    padding: 8px 16px; border: none; border-radius: 8px; cursor: pointer;
    background: var(--accent); color: #fff; font-size: 0.95rem; margin-left: 8px;
  }
  select {
    width: 100%; padding: 8px 10px; border-radius: 8px; border: 1px solid #3a4a6b;
    background: var(--card2); color: var(--text); font-size: 0.95rem; margin: 2px 0 10px;
  }
  label { font-size: 0.85rem; color: var(--muted); }
  .ok { color: var(--ok); }
  .filters { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; margin-bottom: 12px; }
  .filters select { width: auto; margin: 0; }
  .filters input { width: 140px; }
  .ng { color: var(--ng); }
  .warn { color: var(--warn); }
  .budget-row { display: flex; justify-content: space-between; padding: 4px 0; font-size: 0.95rem; }
  #warnings p { margin: 4px 0; }
  footer { color: var(--muted); font-size: 0.8rem; margin-top: 32px; }
  a { color: var(--accent); }
</style>
</head>
<body>
<div class="wrap">
  <h1>🖥️ 自作PC予算計算ツール</h1>
  <div class="sub">価格データ: 価格.com 最安価格 (2026-11-23 時点) が基準 ・ by Earlgrey-Arukido</div>

  <h2>構成パターン</h2>
  <select id="pattern-select"></select>
  <div id="pattern-detail"></div>

  <h2>予算で探す</h2>
  <div class="card">
    <input type="number" id="budget" placeholder="予算 (円)" min="0" step="1000">
    <button onclick="checkBudget()">探す</button>
    <div id="budget-result" style="margin-top:10px;"></div>
  </div>

  <h2>カスタム構成 (互換性チェック付き)</h2>
  <div class="card">
    <div class="filters">
      <span><label>ソケット</label>
      <select id="f-socket">
        <option value="">すべて</option>
        <option>AM4</option><option>AM5</option><option>LGA1700</option><option>LGA1851</option>
      </select></span>
      <span><label>メーカー</label>
      <select id="f-maker">
        <option value="">すべて</option>
        <option>AMD</option><option>Intel</option><option>NVIDIA</option>
      </select></span>
      <span><label>1パーツの予算上限</label>
      <input type="number" id="f-budget" placeholder="上限なし (円)" min="0" step="1000"></span>
    </div>
    <div id="custom-form"></div>
    <div class="total" id="custom-total">合計: ¥0</div>
    <div id="warnings" style="margin-top:8px;"></div>
  </div>

  <footer>
    パーツ価格は変動します。購入前には価格.comで最新価格を確認してください。<br>
    ソースコード: <a href="https://github.com/Earlgrey-Arukido/pc-budget-calculator">GitHub リポジトリ</a>
  </footer>
</div>

const CATEGORIES = ["CPU","CPUクーラー","マザーボード","メモリ","GPU","SSD","電源","ケース","OS"];
const byName = {};
PARTS.forEach(p => byName[p.name] = p);

function yen(n) { return "¥" + n.toLocaleString("ja-JP"); }

function patternTotal(name) {
  return PATTERNS[name].reduce((sum, partName) => sum + byName[partName].price, 0);
}

// ===== 構成パターンの表示 (選択式) =====
function renderPatterns() {
  const sel = document.getElementById("pattern-select");
  Object.keys(PATTERNS).forEach(name => {
    const opt = document.createElement("option");
    opt.value = name;
    opt.textContent = name;
    sel.appendChild(opt);
  });
  sel.addEventListener("change", showSelectedPattern);
  showSelectedPattern();
}

function showSelectedPattern() {
  const name = document.getElementById("pattern-select").value;
  const box = document.getElementById("pattern-detail");
  let rows = "";
  PATTERNS[name].forEach(partName => {
    const p = byName[partName];
    rows += `<tr><td class="cat">${p.cat}</td><td>${p.name}</td><td class="price">${yen(p.price)}</td></tr>`;
  });
  box.innerHTML = `<div class="card"><h3>${name}</h3><table>${rows}</table><div class="total">合計: ${yen(patternTotal(name))}</div></div>`;
}

// ===== 予算で探す =====
function checkBudget() {
  const budget = parseInt(document.getElementById("budget").value, 10);
  const box = document.getElementById("budget-result");
  if (isNaN(budget)) { box.innerHTML = "予算を数字で入力してね"; return; }
  let html = "";
  Object.keys(PATTERNS).forEach(name => {
    const total = patternTotal(name);
    if (total <= budget) {
      html += `<div class="budget-row"><span class="ok">○ ${name}</span><span>${yen(total)} (残り ${yen(budget - total)})</span></div>`;
    } else {
      html += `<div class="budget-row"><span class="ng">× ${name}</span><span>${yen(total)} (${yen(total - budget)} オーバー)</span></div>`;
    }
  });
  box.innerHTML = html;
}

// ===== カスタム構成 (シリーズ別グループ + フィルター) =====
function seriesOf(p) {
  if (p.cat === "CPU") {
    if (p.name.startsWith("AMD")) return "AMD Ryzen (" + p.socket + ")";
    if (p.name.includes("Core Ultra")) return "Intel Core Ultra (" + p.socket + ")";
    return "Intel Core (" + p.socket + ")";
  }
  if (p.cat === "GPU") {
    const m = p.name.match(/RTX (\d)\d{3}/);
    if (m) return "GeForce RTX " + m[1] + "0番台";
    const r = p.name.match(/RX (\d)\d{3}/);
    if (r) return "Radeon RX " + r[1] + "000番台";
    if (p.name.includes("Arc")) return "Intel Arc";
  }
  if (p.cat === "マザーボード") return p.socket;
  return "";
}

const GROUP_ORDER = {
  "CPU": ["AMD Ryzen (AM5)", "AMD Ryzen (AM4)", "Intel Core Ultra (LGA1851)", "Intel Core (LGA1700)"],
  "GPU": ["GeForce RTX 50番台", "GeForce RTX 40番台", "GeForce RTX 30番台", "Radeon RX 9000番台", "Radeon RX 7000番台", "Radeon RX 6000番台", "Intel Arc"],
  "マザーボード": ["AM5", "AM4", "LGA1851", "LGA1700"]
};

function makerOf(p) {
  if (p.cat === "CPU") return p.name.startsWith("AMD") ? "AMD" : "Intel";
  if (p.cat === "GPU") {
    if (p.name.includes("GeForce")) return "NVIDIA";
    if (p.name.includes("Radeon")) return "AMD";
    if (p.name.includes("Arc")) return "Intel";
  }
  return "";
}

function passesFilters(p) {
  const socket = document.getElementById("f-socket").value;
  const maker = document.getElementById("f-maker").value;
  const cap = parseInt(document.getElementById("f-budget").value, 10);
  if (socket && (p.cat === "CPU" || p.cat === "マザーボード") && p.socket !== socket) return false;
  if (maker && (p.cat === "CPU" || p.cat === "GPU") && makerOf(p) !== maker) return false;
  if (!isNaN(cap) && p.price > cap) return false;
  return true;
}

function optionOf(p) {
  const opt = document.createElement("option");
  opt.value = p.name;
  opt.textContent = `${p.name} — ${yen(p.price)}`;
  return opt;
}

function populateOptions(cat) {
  const sel = document.getElementById("sel-" + cat);
  const prev = sel.value;
  sel.innerHTML = `<option value="">(選ばない)</option>`;
  const list = PARTS.filter(p => p.cat === cat && passesFilters(p));
  const groups = {};
  list.forEach(p => {
    const g = seriesOf(p) || "その他";
    (groups[g] = groups[g] || []).push(p);
  });
  let names = Object.keys(groups);
  const order = GROUP_ORDER[cat] || [];
  names.sort((a, b) => {
    const ia = order.indexOf(a), ib = order.indexOf(b);
    return (ia === -1 ? 99 : ia) - (ib === -1 ? 99 : ib);
  });
  if (names.length === 1 && names[0] === "その他") {
    groups["その他"].forEach(p => sel.appendChild(optionOf(p)));
  } else {
    names.forEach(g => {
      const og = document.createElement("optgroup");
      og.label = g;
      groups[g].forEach(p => og.appendChild(optionOf(p)));
      sel.appendChild(og);
    });
  }
  if (prev && list.some(p => p.name === prev)) sel.value = prev;
}

function renderCustomForm() {
  const form = document.getElementById("custom-form");
  CATEGORIES.forEach(cat => {
    const label = document.createElement("label");
    label.textContent = cat;
    form.appendChild(label);
    const sel = document.createElement("select");
    sel.id = "sel-" + cat;
    sel.addEventListener("change", updateCustom);
    form.appendChild(sel);
    populateOptions(cat);
  });
  ["f-socket", "f-maker", "f-budget"].forEach(id => {
    document.getElementById(id).addEventListener("change", () => {
      CATEGORIES.forEach(populateOptions);
      updateCustom();
    });
    document.getElementById(id).addEventListener("input", () => {
      CATEGORIES.forEach(populateOptions);
      updateCustom();
    });
  });
}

function getSelected() {
  const selected = {};
  CATEGORIES.forEach(cat => {
    const v = document.getElementById("sel-" + cat).value;
    if (v) selected[cat] = byName[v];
  });
  return selected;
}

function memMatches(memSpec, cpuSpec) {
  return cpuSpec.split("/").includes(memSpec);
}

function checkCompatibility(selected) {
  const warnings = [];
  const cpu = selected["CPU"], cooler = selected["CPUクーラー"], mb = selected["マザーボード"], mem = selected["メモリ"], gpu = selected["GPU"], pcCase = selected["ケース"];
  if (cpu && mb && cpu.socket !== mb.socket) {
    warnings.push(`CPUのソケット(${cpu.socket})とマザーボードのソケット(${mb.socket})が違う! この組み合わせでは付きません`);
  }
  if (mem && mb && mem.mem !== mb.mem) {
    warnings.push(`メモリ(${mem.mem})がマザーボードの対応規格(${mb.mem})と違う! 物理的に刺さりません`);
  }
  if (mem && cpu && !memMatches(mem.mem, cpu.mem)) {
    warnings.push(`メモリ(${mem.mem})がCPUの対応規格(${cpu.mem})と違う!`);
  }
  if (cpu && !gpu && cpu.igpu === "なし") {
    warnings.push("GPUが選ばれていないのに、選んだCPUには内蔵GPUがない! このままだと画面が出ません");
  }
  if (cpu && !cooler && cpu.cooler === "なし") {
    warnings.push("選んだCPUはクーラー別売りなのに、CPUクーラーが選ばれていない! これでは冷やせません");
  }
  const sizeRank = {"ATX": 3, "MicroATX": 2, "Mini-ITX": 1};
  if (mb && pcCase) {
    const boardSize = sizeRank[mb.ff] || 0;
    const caseSize = sizeRank[pcCase.ff] || 0;
    if (boardSize && caseSize && boardSize > caseSize) {
      warnings.push(`${mb.ff}マザーボードは${pcCase.ff}まで対応のケースに入りません!`);
    }
  }
  return warnings;
}

function updateCustom() {
  const selected = getSelected();
  let total = 0;
  Object.values(selected).forEach(p => total += p.price);
  document.getElementById("custom-total").textContent = "合計: " + yen(total);
  const warnings = checkCompatibility(selected);
  const box = document.getElementById("warnings");
  if (warnings.length > 0) {
    box.innerHTML = warnings.map(w => `<p class="warn">⚠ ${w}</p>`).join("");
  } else if (Object.keys(selected).length > 0) {
    box.innerHTML = `<p class="ok">互換性チェック: 問題なし!</p>`;
  } else {
    box.innerHTML = "";
  }
}

renderCustomForm();
